name: Dependency Review

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Review dependency changes
        uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4
        with:
          fail-on-severity: high
          comment-summary-in-pr: always
          allow-licenses: Apache-2.0
          # Explicit exceptions for MIT-licensed GitHub infrastructure actions
          # that cannot be substituted with Apache-2.0 equivalents.
          allow-dependencies-licenses: >-
            pkg:github/actions/checkout,
            pkg:github/actions/upload-artifact,
            pkg:github/github/codeql-action
