name: Release

on:
  push:
    branches: [main]

# One release at a time; never cancel an in-flight publish
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write # push tags + CHANGELOG commit
  issues: write # comment on resolved issues
  pull-requests: write # comment on merged PRs
  id-token: write # SLSA provenance via npm

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so semantic-release can read all tags
          fetch-depth: 0
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build addon
        run: bun run build

      - name: Release
        run: bunx semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Trusted Publishing: npm accepts an OIDC token from this workflow
          # instead of a long-lived NPM_TOKEN. Configure the trusted publisher
          # on npmjs.com: package → Settings → Trusted Publishing → add this
          # repo + release.yml. No secret needed.
          NPM_CONFIG_PROVENANCE: "true"
