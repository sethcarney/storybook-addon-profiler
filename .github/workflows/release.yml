name: Release

on:
  push:
    branches: [main]

# Prevent concurrent releases
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  # Required for npm provenance (SLSA) — do not remove
  id-token: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history is needed so changesets can compare tags
          fetch-depth: 0
          # Use CHANGESET_TOKEN (a PAT with repo scope) if you want the
          # "Version Packages" PR to trigger CI automatically.
          # Falls back to GITHUB_TOKEN for basic usage.
          token: ${{ secrets.CHANGESET_TOKEN || secrets.GITHUB_TOKEN }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build addon
        run: bun run build

      - name: Create Release Pull Request or Publish to npm
        id: changesets
        uses: changesets/action@v1
        with:
          # Command run when publishing (after version PR is merged)
          publish: bunx changeset publish
          # Command run to bump versions and update changelogs
          version: bunx changeset version
          title: "chore: version packages"
          commit: "chore: version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.CHANGESET_TOKEN || secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          # Enable SLSA provenance attestations on npm publish
          NPM_CONFIG_PROVENANCE: "true"

      - name: Published versions
        if: steps.changesets.outputs.published == 'true'
        run: |
          echo "Published: ${{ steps.changesets.outputs.publishedPackages }}"
