name: Release

on:
  push:
    branches: [main]

# One release at a time; never cancel an in-flight publish
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write # push git tag
  id-token: write # npm Trusted Publishing (OIDC)

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Read version from package.json
        id: pkg
        run: echo "version=$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT

      - name: Check whether this version has already been released
        id: check
        run: |
          if git ls-remote --tags origin "refs/tags/v${{ steps.pkg.outputs.version }}" | grep -q .; then
            echo "skip=true" >> $GITHUB_OUTPUT
            echo "v${{ steps.pkg.outputs.version }} already tagged — nothing to publish."
          else
            echo "skip=false" >> $GITHUB_OUTPUT
            echo "New version v${{ steps.pkg.outputs.version }} — publishing."
          fi

      - name: Build
        if: steps.check.outputs.skip == 'false'
        run: bun run build

      - name: Publish to npm
        if: steps.check.outputs.skip == 'false'
        run: npm publish --provenance
        env:
          NPM_CONFIG_PROVENANCE: "true"

      - name: Tag release
        if: steps.check.outputs.skip == 'false'
        run: |
          git tag "v${{ steps.pkg.outputs.version }}"
          git push origin "v${{ steps.pkg.outputs.version }}"

      - name: Create GitHub release
        if: steps.check.outputs.skip == 'false'
        run: gh release create "v${{ steps.pkg.outputs.version }}" --generate-notes --title "v${{ steps.pkg.outputs.version }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
