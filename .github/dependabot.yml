version: 2
updates:
  - package-ecosystem: bun
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      storybook:
        patterns:
          - "storybook"
          - "@storybook/*"
      ag-grid:
        patterns:
          - "ag-grid-*"

  # The Angular test Storybook keeps its own dependency tree — see
  # .devcontainer/README.md for why it cannot share the root install.
  - package-ecosystem: bun
    directory: "/tests/angular"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      storybook:
        patterns:
          - "storybook"
          - "@storybook/*"
      angular:
        patterns:
          - "@angular/*"
          - "@angular-devkit/*"
          - "zone.js"
      ag-grid:
        patterns:
          - "ag-grid-*"
    ignore:
      # Angular's compiler-cli peer-requires typescript >=6.0 <6.1; a major
      # bump here breaks the Angular test Storybook.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
